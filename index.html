  // Simple markdown-to-HTML (bold **text**, lists starting with - or *)
  function mdToHtml(s) {
    if (!s) return '';
    const esc = escapeHtml(s);
    let out = esc.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Strip leading newline so first line isn't blank
    out = out.replace(/^\n+/, '');
    const lines = out.split('\n');
    let inList = false; let res = [];
    for (const line of lines) {
      const trimmed = line.trim();
      if (/^(-|\*)\s+/.test(trimmed)) {
        if (!inList) { res.push('<ul>'); inList = true; }
        res.push(`<li>${trimmed.replace(/^(-|\*)\s+/, '')}</li>`);
      } else {
        if (inList) { res.push('</ul>'); inList = false; }
        res.push(trimmed ? `<p>${trimmed}</p>` : '');
      }
    }
    if (inList) res.push('</ul>');
    return res.join('');
  }

  function renderChatMessages() {
    const el = document.getElementById('chat-msgs');
    if (!el) return;
    if (!chatHistory.length) return;

    el.innerHTML = chatHistory.map(m => {
      if (m.html) {
        // Rich HTML message (draft review cards)
        return `<div class="chat-msg ${m.role}">${m.html}</div>`;
      }
      return `<div class="chat-msg ${m.role}">${m.role === 'bot' ? mdToHtml(m.text) : '<div class="user-msg">' + escapeHtml(m.text) + '</div>'}</div>`;
    }).join('');

    // Scroll to bottom
    el.scrollTop = el.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function sendCoachMsg() {
    if (coachTyping) return;
    const input = document.getElementById('coach-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    // If draft pending, treat as correction request
    if (state.pendingChatDraft) {
      chatHistory.push({ role: 'user', text });
      saveChatHistory();
      renderChatMessages();
      showTyping();

      const draft = state.pendingChatDraft;
      const correctionPrompt = `อัปเดตข้อมูลนี้ตามคำขอของผู้ใช้:

ข้อมูลปัจจุบัน:
${JSON.stringify(draft.data, null, 2)}

คำขอแก้ไข: ${text}

ตอบกลับด้วย JSON ที่อัปเดตแล้วเท่านั้น ไม่ต้องมีคำอธิบายเพิ่มเติม ให้ผลลัพธ์เป็น JSON object ที่มีโครงสร้างเดียวกับข้อมูลเดิม`;

      const contents = [{ role: 'user', parts: [{ text: correctionPrompt }] }];
      const result = await callGemini('auto', contents, 'คุณเป็นผู้ช่วยที่แปลงคำขอแก้ไขข้อมูลเป็น JSON กรุณาตอบด้วย JSON เท่านั้น');
      hideTyping();

      if (result.error) {
        chatHistory.push({ role: 'bot', text: `⚠️ ไม่สามารถแก้ไขข้อมูลได้: ${result.error}` });
      } else {
        try {
          // Parse corrected data
          let corrected = result.text.trim();
          // Strip markdown code fence if present
          if (corrected.startsWith('```')) {
            corrected = corrected.replace(/^```(?:json)?\n/, '').replace(/\n```$/, '');
          }
          const updated = JSON.parse(corrected);
          state.pendingChatDraft.data = updated;
          renderChatDraftReviewCard();
          chatHistory.push({ role: 'bot', text: '✅ อัปเดตข้อมูลแล้ว กรุณาตรวจสอบด้านบน' });
        } catch (e) {
          console.error('parse corrected data failed:', e);
          chatHistory.push({ role: 'bot', text: '⚠️ แก้ไขข้อมูลไม่สำเร็จ กรุณาลองใหม่' });
        }
      }
      saveChatHistory();
      renderChatMessages();
      return;
    }

    // Normal chat flow
    chatHistory.push({ role: 'user', text });
    saveChatHistory();
    renderChatMessages();
    showTyping();

    const systemPrompt = buildCoachSystemPrompt();
    const contents = [];
    const recent = chatHistory.slice(-20);
    for (const m of recent) {
      if (m.role === 'user') {
        contents.push({ role: 'user', parts: [{ text: m.text }] });
      } else if (m.role === 'bot') {
        contents.push({ role: 'model', parts: [{ text: m.text }] });
      }
    }

    const result = await callGemini('auto', contents, systemPrompt);
    hideTyping();

    if (result.error) {
      chatHistory.push({ role: 'bot', text: `⚠️ ${result.error}` });
    } else {
      chatHistory.push({ role: 'bot', text: result.text });
    }
    saveChatHistory();
    renderChatMessages();
  }

  // ---------- chat photo draft workflow ----------
  function formatChatDraftData(draft) {
    if (!draft || !draft.data) return '';
    const d = draft.data;
    const type = draft.type;

    if (type === 'cardio') {
      const parts = [];
      if (d.distance) parts.push(`${d.distance} km`);
      if (d.duration) parts.push(fmtDuration(d.duration));
      if (d.pace) parts.push(`Pace ${fmtDuration(d.pace)}/km`);
      if (d.avgHR) parts.push(`HR ${d.avgHR} bpm`);
      if (d.notes) parts.push(`หมายเหตุ: ${d.notes}`);
      return parts.length ? '📸 พบข้อมูลการวิ่ง: ' + parts.join(' / ') : 'ไม่พบข้อมูล';
    }

    if (type === 'food') {
      if (!d.items || !d.items.length) return 'ไม่พบรายการอาหาร';
      const total = d.items.reduce((sum, it) => sum + (it.cal || 0), 0);
      const totalP = d.items.reduce((sum, it) => sum + (it.protein || 0), 0);
      const itemList = d.items.map(it => `- ${it.item}: ${it.cal || 0} kcal, ${it.protein || 0}g โปรตีน`).join('\n');
      return `🍽️ พบรายการอาหาร ${d.items.length} รายการ:\n${itemList}\n\n📊 รวม: ${total} kcal / ${totalP}g โปรตีน`;
    }

    if (type === 'gym') {
      if (!d.exercises || !d.exercises.length) return 'ไม่พบรายการออกกำลังกาย';
      const exList = d.exercises.map(ex => `- ${ex.name}: ${ex.sets || 0} sets × ${ex.reps || 0} reps @ ${ex.weight || 0} kg`).join('\n');
      return `🏋️ พบรายการออกกำลังกาย ${d.exercises.length} รายการ:\n${exList}`;
    }

    if (type === 'weight') {
      return `⚖️ พบน้ำหนัก: ${d.weight || 0} kg` + (d.date ? ` (${d.date})` : '');
    }

    return JSON.stringify(d);
  }

  async function handleChatPhotoUpload(input) {
    try {
      const files = Array.from(input.files || []);
      if (!files.length) return;

      const file = files[0];
      const currentTab = document.querySelector('.tab-btn.active').dataset.tab;
      let extractFn;
      if (currentTab === 'cardio') extractFn = extractFromPhoto;
      else if (currentTab === 'food') extractFn = extractFoodPhoto;
      else if (currentTab === 'coach') extractFn = extractFromPhoto;
      else { console.log('chat photo upload skipped: unsupported tab'); return; }

      // Show image preview in chat before extraction
      const reader = new FileReader();
      reader.onload = (e) => {
        const imgHtml = `<img src="${e.target.result}" style="max-width: 100%; border-radius: 8px; margin-top: 8px;" />`;
        chatHistory.push({ role: 'user', html: imgHtml });
        saveChatHistory();
        renderChatMessages();
      };
      reader.readAsDataURL(file);

      const overlay = document.getElementById('photo-overlay');
      overlay.classList.add('active');

      const data = await extractFn(input);
      state.pendingChatDraft = { type: currentTab, data };
      renderChatDraftReviewCard();

      overlay.style.display = 'none';
      try { input.value = ''; } catch (e) {}
    } catch (e) {
      console.error('chat photo upload failed:', e);
      toast(`❌ ${e.message || 'วิเคราะห์รูปไม่สำเร็จ'}`);
      const overlay = document.getElementById('photo-overlay');
      if (overlay) overlay.style.display = 'none';
    }
  }

  function renderChatDraftReviewCard() {
    const draft = state.pendingChatDraft;
    if (!draft) return;

    // Remove any existing draft message from chatHistory
    chatHistory = chatHistory.filter(m => !m.isDraft);

    const formatted = formatChatDraftData(draft);
    const html =
      '<div class="draft-header">รีวิวข้อมูลจากรูป</div>' +
      '<div class="draft-content" style="white-space: pre-wrap;">' + escapeHtml(formatted) + '</div>' +
      '<div class="draft-actions">' +
        '<button onclick="confirmChatDraft()">ยืนยัน</button>' +
        '<button onclick="cancelChatDraft()">ยกเลิก</button>' +
        '<button onclick="editChatDraft()">แก้ไข</button>' +
      '</div>';

    chatHistory.push({ role: 'bot', html, isDraft: true });
    renderChatMessages();
  }

  async function confirmChatDraft() {
    try {
      const draft = state.pendingChatDraft;
      if (!draft) return;

      const map = {
        cardio: 'cardio-logs',
        food: 'food-logs',
        gym: 'gym-logs',
        weight: 'weight-log'
      };
      const key = map[draft.type];
      if (key) {
        state[draft.type].push(draft.data);
        await save(key, state[draft.type]);
        route(draft.type);
      }

      state.pendingChatDraft = null;
      chatHistory = chatHistory.filter(m => !m.isDraft);
      saveChatHistory();
      renderChatMessages();
      toast('✅ บันทึกข้อมูลสำเร็จ');
    } catch (e) {
      console.error('confirm draft failed:', e);
      toast('❌ บันทึกข้อมูลไม่สำเร็จ');
    }
  }

  function cancelChatDraft() {
    state.pendingChatDraft = null;
    chatHistory = chatHistory.filter(m => !m.isDraft);
    saveChatHistory();
    renderChatMessages();
    toast('ยกเลิกการบันทึก');
  }

  function editChatDraft() {
    if (!state.pendingChatDraft) return;
    const input = document.getElementById('coach-input');
    if (input) {
      input.focus();
      toast('💬 พิมพ์คำสั่งแก้ไขข้อมูล เช่น "เปลี่ยนระยะทางเป็น 6 km" หรือ "เพิ่ม HR เป็น 155"');
    }
  }

  async function sendProactiveSuggestion() {
    if (chatHistory.length) return;
    coachTyping = true;

    const systemPrompt = buildCoachSystemPrompt();
    const contents = [{ role: 'user', parts: [{ text: 'ช่วยวิเคราะห์ข้อมูลของฉันวันนี้และแนะนำสิ่งที่ควรทำวันนี้หน่อย — พูดสั้นๆ 1-2 ประโยค เป็นภาษาไทย' }] }];

    const result = await callGemini('auto', contents, systemPrompt);
    coachTyping = false;

    if (result.text) {
      chatHistory.push({ role: 'bot', text: result.text });
      saveChatHistory();
      renderChatMessages();
    }
  }

  // ---------- shared ----------
  function delEntry(kind, id) {
    const map = { cardio: 'cardio-logs', gym: 'gym-logs', food: 'food-logs' };
    state[kind] = state[kind].filter(e => e.id !== id);
    save(map[kind], state[kind]);
    route(kind);
  }

  const routers = { overview: renderOverview, cardio: renderCardio, gym: renderGym, food: renderFood, cycle: renderCycle, settings: renderSettings, coach: renderCoach };
  function route(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    // Scroll active tab into view for horizontal scroll tabs
    const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
    if (activeBtn) {
      activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    routers[tab]();
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (btn) route(btn.dataset.tab);
  });

  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });

  function toggleCycleTabVisibility() {
    const cycleTab = document.querySelector('.tab-btn[data-tab="cycle"]');
    if (!cycleTab) return;

    const gender = state.profile && state.profile.gender;
    if (gender === 'female') {
      cycleTab.style.display = '';
    } else {
      cycleTab.style.display = 'none';
      if (document.querySelector('.tab-btn[data-tab="cycle"].active')) {
        route('overview');
      }
    }
  }

  loadAll().then(() => {
    toggleCycleTabVisibility();
    route('overview');
  });

  function showTyping() {
    coachTyping = true;
    const el = document.getElementById('chat-msgs');
    if (!el) return;
    const div = document.createElement('div');
    div.className = 'chat-msg bot';
    div.id = 'typing-indicator';
    div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  function hideTyping() {
    coachTyping = false;
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }
</script>

<div id="photo-overlay" class="photo-overlay">
  <div class="spinner"></div>
  <div style="color:var(--surface); font-size:14px; font-weight:500;">กำลังวิเคราะห์รูป...</div>
</div>

</body>
